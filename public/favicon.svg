<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a0533"/>
      <stop offset="50%" stop-color="#0f0c29"/>
      <stop offset="100%" stop-color="#0d1b4b"/>
    </linearGradient>
    
    <!-- Center glow -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#4f46e5" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Outer ring gradient -->
    <linearGradient id="ringGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="40%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    
    <!-- Inner ring gradient -->
    <linearGradient id="ringGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.5)"/>
      <stop offset="50%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="rgba(129,140,248,0.6)"/>
    </linearGradient>
    
    <!-- Text gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#ddd6fe"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    
    <!-- Glow filter -->
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Strong glow -->
    <filter id="strongGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="14" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Clip path for rounded square -->
    <clipPath id="rounded">
      <rect width="512" height="512" rx="115" ry="115"/>
    </clipPath>
  </defs>
  
  <!-- Rounded square clip -->
  <g clip-path="url(#rounded)">
    
    <!-- Background -->
    <rect width="512" height="512" fill="url(#bg)"/>
    
    <!-- Center glow -->
    <ellipse cx="256" cy="256" rx="256" ry="256" fill="url(#centerGlow)"/>
    
    <!-- Outer decorative ring -->
    <circle cx="256" cy="256" r="195" fill="none" stroke="url(#ringGrad1)" stroke-width="6" filter="url(#glow)" opacity="0.85"/>
    
    <!-- Inner ring -->
    <circle cx="256" cy="256" r="138" fill="none" stroke="url(#ringGrad2)" stroke-width="4" filter="url(#glow)" opacity="0.7"/>
    
    <!-- Arc accent — top right -->
    <path d="M 256,61 A 195,195 0 0 1 451,256" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.9" filter="url(#glow)"/>
    
    <!-- Letter A centered -->
    <text
      x="256"
      y="310"
      font-family="Georgia, 'Times New Roman', serif"
      font-size="240"
      font-weight="bold"
      text-anchor="middle"
      fill="url(#textGrad)"
      filter="url(#strongGlow)"
    >A</text>
    
    <!-- Subtle subtitle -->
    <text
      x="256"
      y="428"
      font-family="-apple-system, 'SF Pro Display', sans-serif"
      font-size="36"
      font-weight="500"
      letter-spacing="10"
      text-anchor="middle"
      fill="#c4b5fd"
      opacity="0.55"
    >AURA</text>
    
    <!-- Star sparkles -->
    <!-- Top right star -->
    <g filter="url(#glow)" opacity="0.9">
      <polygon points="390,96 394,107 406,107 397,114 400,126 390,119 380,126 383,114 374,107 386,107" fill="white" transform="scale(0.7) translate(170, 50)"/>
    </g>
    
    <!-- Left star -->
    <g filter="url(#glow)" opacity="0.75">
      <polygon points="390,96 394,107 406,107 397,114 400,126 390,119 380,126 383,114 374,107 386,107" fill="#c4b5fd" transform="scale(0.5) translate(-220, 260)"/>
    </g>
    
    <!-- Small dot sparkles -->
    <circle cx="400" cy="135" r="4" fill="white" opacity="0.9" filter="url(#glow)"/>
    <circle cx="115" cy="165" r="3" fill="#a78bfa" opacity="0.8" filter="url(#glow)"/>
    <circle cx="368" cy="390" r="3.5" fill="white" opacity="0.7" filter="url(#glow)"/>
    <circle cx="145" cy="350" r="2.5" fill="#c4b5fd" opacity="0.8" filter="url(#glow)"/>
    <circle cx="430" cy="290" r="2" fill="white" opacity="0.7" filter="url(#glow)"/>
    <circle cx="95" cy="255" r="5" fill="#818cf8" opacity="0.6" filter="url(#glow)"/>
    
    <!-- 4-pointed star at top-left -->
    <path d="M 145,108 L 149,120 L 161,124 L 149,128 L 145,140 L 141,128 L 129,124 L 141,120 Z" fill="white" opacity="0.85" filter="url(#glow)"/>
    
  </g>
</svg>